<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Construction King Sarl</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-yellow: #ffc107;
            --brand-yellow-hover: #e0a800;
            --brand-dark: #2c323f;
            --text-muted: #6c757d;
            --bg-light: #f4f6f8;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--brand-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .logo-area {
            text-align: left;
            margin-bottom: 30px;
        }

        .logo-area h2 {
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
            font-size: 1.75rem;
            color: var(--brand-dark);
        }

        .logo-area span {
            color: var(--brand-yellow);
        }

        .accent-line {
            width: 45px;
            height: 4px;
            background-color: var(--brand-yellow);
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 2px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brand-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 2px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: var(--brand-dark);
            transition: all 0.2s ease;
        }

        .form-control::placeholder {
            color: #a0aec0;
        }

        .form-control:focus {
            border-color: var(--brand-yellow);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2);
            outline: none;
        }

        .btn-submit {
            background-color: var(--brand-yellow);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 2px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s ease;
            text-transform: capitalize;
            font-size: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--brand-yellow-hover);
            color: #ffffff;
        }

        /* Pop-out Notification Styling */
        .notification-wrapper {
            z-index: 1080;
            width: 90%;
            max-width: 400px;
        }

        .custom-alert {
            background-color: var(--brand-dark) !important;
            color: white !important;
            border: none;
            border-left: 5px solid var(--brand-yellow) !important;
            border-radius: 4px;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .signup-link a {
            color: var(--brand-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            color: var(--brand-yellow);
        }
    </style>
</head>
<body>

<div class="notification-wrapper position-fixed top-0 start-50 translate-middle-x mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert custom-alert alert-dismissible fade show shadow-lg" role="alert">
                <i class="fas fa-info-circle me-2"></i> {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="login-container">
    <div class="logo-area">
        <h2>Construction King <span>Sarl</span></h2>
        <div class="accent-line"></div>
        <p class="text-muted small mb-0">Sign in to access your dashboard</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username or Email</label>
            <input type="text" name="user" class="form-control" placeholder="Name or email" required>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0">Password</label>
                <a href="{% url 'forgot_password' %}" class="small text-decoration-none" style="color: var(--text-muted);">Forgot?</a>
            </div>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">
            Sign In <i class="fas fa-arrow-right ms-1"></i>
        </button>

        <div class="signup-link">
            Not registered? <a href="{% url 'register' %}">Create account</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Bulletproof fix for the close button
    document.addEventListener('click', function (event) {
        if (event.target.classList.contains('btn-close') || event.target.closest('.btn-close')) {
            const alert = event.target.closest('.alert');
            if (alert) {
                alert.style.opacity = "0";
                setTimeout(() => alert.remove(), 300);
            }
        }
    });

    // Auto-dismiss notifications after 5s
    setTimeout(() => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            alert.style.opacity = "0";
            setTimeout(() => alert.remove(), 300);
        });
    }, 5000);
</script>

</body>
</html>
