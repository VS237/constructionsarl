<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Construction King Sarl</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brand-yellow: #ffc107; --brand-dark: #2c323f; }
        body { font-family: 'Inter', sans-serif; background: #f4f6f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-box { width: 100%; max-width: 440px; background: #fff; padding: 40px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-submit { background-color: var(--brand-yellow); color: #fff; font-weight: 600; border: none; padding: 12px; width: 100%; }
        .btn-submit:hover { background-color: #e0a800; color: #fff; }
    </style>
</head>
<body>

<div class="card-box">
    <h3 class="fw-bold mb-2">Reset Password</h3>
    <p class="text-muted small mb-4">Enter your email address to receive a recovery link.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-dark text-white p-2 small mb-3">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label small fw-bold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <button type="submit" class="btn btn-submit">Send Recovery Link</button>
    </form>
    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
    </div>
</div>

</body>
</html>
